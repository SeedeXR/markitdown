[package]
name = "markitdown-core"
description = "Pure-Rust port of Microsoft MarkItDown: convert files (PDF, DOCX, XLSX, PPTX, HTML, images, audio, …) to Markdown"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["net"]
# URL fetching (http/https inputs, Wikipedia/Bing/YouTube live pages).
# Disable for a fully offline build: cargo build --no-default-features
net = ["dep:ureq"]
# Optional fast PDF backend: Google PDFium (loaded as a dynamic library at
# runtime). ~20x faster than the pure-Rust path on large PDFs. Off by default —
# enabling it pulls a C library that must be present at runtime
# (MARKITDOWN_PDFIUM_LIB / next to the binary / system). Build with:
#   cargo build --features pdfium
pdfium = ["dep:pdfium-render"]

[dependencies]
pdf-extract = { workspace = true }
# Not used directly — declared so Cargo feature-unification turns ON lopdf's
# `rayon` feature for the lopdf that pdf-extract uses (pdf-extract pulls it with
# default-features=false, which disables rayon). This parallelizes PDF object
# parsing across cores: ~3x faster load on large PDFs (57s -> ~20s end-to-end).
lopdf = { workspace = true }
calamine = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
htmd = { workspace = true }
scraper = { workspace = true }
kamadak-exif = { workspace = true }
imagesize = { workspace = true }
lofty = { workspace = true }
msg_parser = { workspace = true }
csv = { workspace = true }
mobi = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }
file-format = { workspace = true }
base64 = { workspace = true }
percent-encoding = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
ureq = { workspace = true, optional = true }
pdfium-render = { workspace = true, optional = true }
